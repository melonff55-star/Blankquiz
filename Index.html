  const tInp = el("input", { class: "inp", value: t, style: { marginBottom: "10px" }, onInput: (e) => t = e.target.value });
  box.appendChild(tInp);
  box.appendChild(lbl("\uD78C\uD2B8 (\uC120\uD0DD)"));
  const hInp = el("input", { class: "inp", value: h, placeholder: "\uD78C\uD2B8...", style: { marginBottom: "10px" }, onInput: (e) => h = e.target.value });
  box.appendChild(hInp);
  box.appendChild(lbl("\uBCF8\uBB38"));
  const ta = el("textarea", { class: "inp", rows: "8", onInput: (e) => b = e.target.value });
  ta.value = b;
  box.appendChild(ta);
  const wrapBlank = btn("\uC120\uD0DD\u2192[[\uBE48\uCE78]]", "small", () => {
    const s = ta.selectionStart, e = ta.selectionEnd;
    if (s === e) return;
    const next = ta.value.slice(0, s) + `[[${ta.value.slice(s, e)}]]` + ta.value.slice(e);
    ta.value = next;
    b = next;
    ta.focus();
    ta.setSelectionRange(s + 2, e + 2);
  });
  const wrapCho = btn("\uC120\uD0DD\u2192{\uCD08\uC131}", "small teal", () => {
    const s = ta.selectionStart, e = ta.selectionEnd;
    if (s === e) return;
    const next = ta.value.slice(0, s) + `{${ta.value.slice(s, e)}}` + ta.value.slice(e);
    ta.value = next;
    b = next;
    ta.focus();
    ta.setSelectionRange(s + 1, e + 1);
  });
  const saveBtn = btn("\uC800\uC7A5", "accent", () => {
    if (!t.trim() || !b.trim()) {
      alert("\uC81C\uBAA9\uACFC \uBCF8\uBB38\uC744 \uC785\uB825\uD558\uC138\uC694.");
      return;
    }
    const pp = parseBody(b);
    if (!pp.some((p) => p.type === "blank" || p.type === "cho")) {
      alert("[[\uBE48\uCE78]] \uB610\uB294 {\uCD08\uC131}\uC744 \uD558\uB098 \uC774\uC0C1 \uC9C0\uC815\uD558\uC138\uC694.");
      return;
    }
    persist({ subjects, cards: cards.map((c) => c.id === card.id ? { ...c, title: t.trim(), hint: h.trim(), body: b.trim(), subjectId: sid, chapterId: cid } : c) });
    set({ cardEdit: null });
  });
  box.appendChild(el("div", { class: "flex", style: { marginTop: "12px", justifyContent: "flex-end" } }, [wrapBlank, wrapCho, btn("\uCDE8\uC18C", "", () => set({ cardEdit: null })), saveBtn]));
  bg.appendChild(box);
  return bg;
}
function handleKeyDown(e) {
  if (e.key !== "Enter") return;
  const target = e.target;
  if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) return;
  const v = S.view;
  if (v === "study" && S.studyPhase === "result") {
    const card = S.studyQueue[S.studyIdx];
    if (!card) return;
    const parts = parseForMode(card.body, S.studyMode);
    const actives = getActiveParts(parts, S.studyMode);
    const allOk = actives.every((a, i) => (S.studyInputs[i] || "").trim() === a.value.trim());
    if (allOk) {
      const nd = S.studyDone + 1, ni = S.studyIdx + 1;
      saveStudy({ selSub: S.selSub, selCh: S.selCh, studyIdx: ni, studyDone: nd, studyMode: S.studyMode, studyStartIdx: S.studyStartIdx, studyCount: S.studyCount });
      if (ni >= S.studyQueue.length) clearStudy();
      set({ studyDone: nd, studyIdx: ni, studyPhase: "answering", studyInputs: [], studyCb: 0, studyLocked: {} });
    } else {
      const nl = {};
      actives.forEach(function(a, i) {
        if ((S.studyInputs[i] || "").trim() === a.value.trim()) nl[i] = true;
      });
      const ni2 = actives.map(function(a, i) {
        return nl[i] ? a.value : "";
      });
      const fi = ni2.findIndex(function(_, i) {
        return !nl[i];
      });
      set({ studyPhase: "answering", studyLocked: nl, studyInputs: ni2, studyCb: fi >= 0 ? fi : 0 });
    }
  } else if (v === "test" && S.testPhase === "result") {
    const card = S.testDeck[S.testIdx];
    if (!card) return;
    const blanks = parseForMode(card.body, "blank").filter((p) => p.type === "blank");
    const cc = blanks.filter((_, i) => (S.testInputs[i] || "").trim() === blanks[i].value.trim()).length;
    set({ testResults: [...S.testResults, { card, correct: cc, total: blanks.length }], testIdx: S.testIdx + 1, testPhase: "answering", testInputs: [], testCb: 0 });
  } else if (v === "review" && S.revPhase === "result") {
    advanceReviewNext();
  }
}
let activeTargetContainer = null;
function render() {
  const app = activeTargetContainer || document.getElementById("app");
  if (!app) return;
  app.innerHTML = "";
  app.appendChild(renderHeader());
  const { view } = S;
  if (view === "home") app.appendChild(renderHome());
  else if (view === "create") app.appendChild(renderCreate());
  else if (view === "study") {
    const r = renderStudy();
    if (r) app.appendChild(r);
  } else if (view === "test") app.appendChild(renderTest());
  else if (view === "review") app.appendChild(renderReview());
  else if (view === "cards") app.appendChild(renderCards());
}
function startApp(container) {
  activeTargetContainer = container;
  document.removeEventListener("keydown", handleKeyDown);
  document.addEventListener("keydown", handleKeyDown);
  try {
    render();
  } catch (e) {
    container.innerHTML = '<div style="padding:20px;color:red;font-size:13px;background:#fff;margin:20px;border-radius:8px"><b>\uC624\uB958 \uBC1C\uC0DD:</b><br>' + e.message + "<br><br>" + e.stack + "</div>";
  }
  return () => {
    document.removeEventListener("keydown", handleKeyDown);
  };
}


document.addEventListener('DOMContentLoaded', function() {
  var app = document.getElementById('app');
  if (app && typeof startApp === 'function') {
    startApp(app);
  }
});
</script>
